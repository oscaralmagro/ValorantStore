name: vstore
description: Tienda diaria de Valorant.
publish_to: none
version: 1.2.0+3
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  webview_flutter: ^4.9.0
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  video_player: ^2.9.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  adaptive_icon_background: "#0F1923"
  adaptive_icon_foreground: assets/icon_fg.png
